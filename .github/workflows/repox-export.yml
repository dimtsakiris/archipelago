name: Export Wikibase to Repox XML
on:
  schedule:
    - cron: "0 5 * * 1"      # every Monday 05:00 UTC
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - run: python scripts/wikibase_to_repox.py --out-dir repox_export --zip
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add repox_export
          git diff --cached --quiet || (git commit -m "Update Repox export" && git push)
